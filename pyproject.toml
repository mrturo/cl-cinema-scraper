[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinema-scraper"
version = "0.1.0"
description = "Chilean cinema chain web scraper with REST API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "coverage>=7.5.0",
]

[project.scripts]
cinema-scheduler = "cinema.scheduler:main"
cinema-api = "cinema.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N818"]  # Exception names may omit Error suffix where specified

[tool.ruff.lint.isort]
known-first-party = ["cinema"]

[tool.pytest.ini_options]
anyio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
no-index = true
find-links = ["packages"]
python-preference = "only-system"

[tool.uv.sources]
aiosqlite = {path = "vendor/aiosqlite"}
apscheduler = {path = "vendor/apscheduler"}
pytest-asyncio = {path = "vendor/pytest-asyncio"}
